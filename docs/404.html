<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page not found · TTB</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" type="image/svg+xml" href="/TTB/assets/favicon.svg">
<style>
  :root{
    --ink:#0b1220;--ink-2:#3d4757;--ink-3:#6b7686;--blue:#2563eb;--blue-ink:#1d4ed8;
    --line:#dfe4ec;--line-strong:#c3ccdb;--paper:#fff;--paper-2:#f7f9fc;
    --grid:rgba(37,99,235,.07);--grid-lg:rgba(37,99,235,.11);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background-color:var(--paper);color:var(--ink);font-family:var(--sans);padding:24px;
    background-image:
      linear-gradient(to right,var(--grid) 1px,transparent 1px),
      linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;
  }
  .box{
    max-width:620px;width:100%;background:#fff;border:1px solid var(--line);
    padding:48px 44px;position:relative;
  }
  .box::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(to right,var(--grid-lg) 1px,transparent 1px),
      linear-gradient(to bottom,var(--grid-lg) 1px,transparent 1px);
    background-size:140px 140px;
  }
  .code{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-ink);font-weight:700}
  h1{font-size:clamp(3rem,12vw,5.4rem);line-height:1;letter-spacing:-.04em;margin:14px 0 8px;font-weight:800}
  h1 span{color:var(--blue)}
  p{color:var(--ink-2);margin:0 0 26px;font-size:1.02rem}
  .rule{border:0;border-top:1px solid var(--line);margin:26px 0}
  a.btn{
    display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13px;font-weight:700;
    letter-spacing:.04em;text-transform:uppercase;padding:13px 20px;border-radius:2px;
    background:var(--blue);color:#fff;text-decoration:none;
  }
  a.btn:hover{background:var(--blue-ink)}
  a.ghost{background:#fff;color:var(--ink);border:1px solid var(--line-strong);margin-left:10px}
  a.ghost:hover{border-color:var(--blue);color:var(--blue-ink)}
  .foot{margin-top:34px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-3)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
  <main class="box">
    <div class="code">Error 404 · Not found</div>
    <h1>Dead <span>link.</span></h1>
    <p>The page you asked for isn't part of TTB. The toolbox itself is one click away.</p>
    <hr class="rule">
    <a class="btn" href="/TTB/">Back to TTB</a>
    <a class="btn ghost" href="https://github.com/drsamonline/TTB">GitHub ↗</a>
    <div class="foot">Built by Dr. Sohil Momin · MIT licensed</div>
  </main>
</body>
</html>
