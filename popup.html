<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTB — Tiny Toolbox</title>
<link rel="stylesheet" href="ui/style.css">
</head>
<body>
<header>
  <h1>TTB — Tiny Toolbox</h1>
  <input id="search" autofocus autocomplete="off" placeholder="Search tools… (Ctrl+K)">
</header>
<div id="status" class="sr-only" role="status" aria-live="polite"></div>
<main class="layout">
  <aside class="category-panel" aria-label="Tool categories">
    <div class="category-heading">Browse by category</div>
    <nav id="categories" class="categories" aria-label="Tool categories"></nav>
  </aside>
  <section id="list" aria-label="Tools"></section>
  <section class="panel" id="panel" hidden>
    <h2></h2>
    <div class="category"></div>
    <div id="fields" class="fields"></div>
    <div id="confirm-row" class="confirm" hidden>
      <label><input type="checkbox"> I understand — confirm this destructive action</label>
    </div>
    <div class="actions" id="actions">
      <button id="run">Run</button>
      <button id="copy">Copy result</button>
      <button id="clear">Clear</button>
    </div>
    <div class="output-label">Result</div>
    <div id="output" class="output" aria-live="polite"></div>
  </section>
</main>
<script src="data/tools.js"></script>
<script src="ui/app.js"></script>
</body>
</html>
