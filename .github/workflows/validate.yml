name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check every JavaScript module
        shell: bash
        run: |
          set -e
          find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -not -path './dist/*' -print0 |
            xargs -0 -n1 node --check
          find . -type f -name '*.mjs' -not -path './.git/*' -not -path './node_modules/*' -not -path './dist/*' -print0 |
            xargs -0 -n1 node --check

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest OK')"

      - name: Run the smoke test
        run: node test.mjs

      - name: Build every browser target
        run: node build.mjs

      - name: Smoke-test each built package
        shell: bash
        run: |
          set -e
          for t in chrome edge firefox safari; do
            cp test.mjs "dist/$t/test.mjs"
            ( cd "dist/$t" && node test.mjs )
            rm -f "dist/$t/test.mjs"
          done

      - name: Package the builds
        run: |
          for t in chrome edge firefox safari; do
            ( cd dist && zip -qr "../ttb-$t.zip" "$t" )
          done
          ls -la ttb-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ttb-browser-builds
          path: ttb-*.zip
          if-no-files-found: error
